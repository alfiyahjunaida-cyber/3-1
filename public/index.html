<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Multi Tools</title>
<style>
  :root{color-scheme:dark;--bg:#0f1115;--panel:#1a1f2b;--border:#2a3040;--border-2:#353d4f;--text:#e8ecf3;--text-2:#a0aabc;--text-3:#6b7789;--accent:#8b7ff5;--accent-2:#a899ff;--accent-bg:rgba(139,127,245,0.12);--accent-border:rgba(139,127,245,0.3);--green:#4ade80;--green-bd:#2a7a3e;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--ease-out:cubic-bezier(0.16,1,0.3,1);--ease-spring:cubic-bezier(0.34,1.56,0.64,1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  header{padding:14px 18px;background:rgba(15,17,21,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding-top:calc(14px + env(safe-area-inset-top,0))}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#a899ff);display:grid;place-items:center;color:#0f1115;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:0 4px 20px rgba(139,127,245,.35)}
  .title-block h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px}
  .subtitle{font-size:11px;color:var(--text-3);margin-top:2px;display:flex;align-items:center;gap:5px}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 2s ease-in-out infinite}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.5}}
  .status-dot.offline{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
  .status-dot.loading{background:var(--yellow);animation:pulseDot 1s ease-in-out infinite}
  .title-block{flex:1;min-width:0}
  .tabs{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--border);padding:0 8px;scrollbar-width:none;position:sticky;top:61px;z-index:15}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:13px 16px;font-size:11px;color:var(--text-2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:600;letter-spacing:.6px;text-transform:uppercase;transition:color .15s,border-color .15s;background:transparent;border:none;font-family:inherit}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:14px;max-width:760px;margin:0 auto;padding-bottom:90px}
  .panel{display:none}.panel.active{display:block;animation:fadeIn .3s var(--ease-out)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  h2{font-size:11px;margin:0 0 12px;color:var(--text-3);letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
  label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600}
  input,textarea,select,button{font-family:inherit;font-size:14px;outline:none}
  input,textarea,select{width:100%;padding:12px 14px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
  textarea{resize:vertical;min-height:70px;line-height:1.5;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  input:focus,textarea:focus,select:focus{border-color:var(--accent-border);box-shadow:0 0 0 4px var(--accent-bg)}
  input::placeholder,textarea::placeholder{color:var(--text-3)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid-2>div>label{margin-bottom:6px}
  .grid-2>div>input{margin-bottom:0}
  button.primary{width:100%;padding:14px 20px;background:linear-gradient(135deg,var(--accent),#7c6fe8);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;transition:all .2s var(--ease-out);box-shadow:0 4px 16px rgba(139,127,245,.4);font-size:15px;margin-top:4px}
  button.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,127,245,.5)}
  button.primary:active:not(:disabled){transform:translateY(0) scale(.98)}
  button.primary:disabled{background:#232936;color:var(--text-3);cursor:not-allowed;box-shadow:none}
  button.primary .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .providers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .pill{padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--border);font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:6px}
  .pill .dot{width:6px;height:6px;border-radius:999px;background:var(--text-3)}
  .pill.ok .dot{background:var(--green)}.pill.fl .dot{background:var(--red)}
  .pill.run .dot{background:var(--yellow);animation:pulseDot .8s ease-in-out infinite}
  .pill.ok{color:var(--green);border-color:var(--green-bd)}.pill.fl{color:var(--red);border-color:#5a1f1f}.pill.run{color:var(--yellow);border-color:#5a4a1f}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}
  .stat .num{font-size:18px;font-weight:700;display:block;line-height:1;margin-bottom:4px}
  .stat .label{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px}
  .stat.ok .num{color:var(--green)}.stat.fl .num{color:var(--red)}.stat.tot .num{color:var(--blue)}.stat.dur .num{color:var(--yellow)}
  #log,#logAm{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;height:240px;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;line-height:1.6;scroll-behavior:smooth}
  #log:empty::before,#logAm:empty::before{content:"belum ada log.";color:var(--text-3);font-style:italic}
  #log::-webkit-scrollbar,#logAm::-webkit-scrollbar{width:6px}
  #log::-webkit-scrollbar-thumb,#logAm::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
  .log-entry{padding:4px 0;border-bottom:1px dashed var(--border);display:flex;gap:8px;font-size:12px;animation:logIn .3s var(--ease-out)}
  @keyframes logIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
  .log-entry:last-child{border-bottom:none}
  .log-entry .ts{color:var(--text-3);flex-shrink:0;font-size:11px}
  .log-entry .body{flex:1;word-break:break-word}
  .log-entry.ok .body{color:var(--green)}.log-entry.err .body{color:var(--red)}.log-entry.info .body{color:var(--blue)}.log-entry.warn .body{color:var(--yellow)}
  .result-card{margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;display:none}
  .result-card.show{display:block;animation:cardIn .4s var(--ease-spring)}
  @keyframes cardIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .result-card.ok{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.05)}
  .result-card.err{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.05)}
  .result-card .row{display:flex;justify-content:space-between;padding:4px 0;gap:8px}
  .result-card .row .k{color:var(--text-3)}
  .result-card .row .v{color:var(--text);font-weight:600;text-align:right;word-break:break-all}
  .result-card .row .v.ok{color:var(--green)}.result-card .row .v.err{color:var(--red)}
  #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px) scale(.9);padding:12px 20px;background:#232936;border:1px solid var(--border-2);border-radius:12px;font-size:13px;color:var(--text);opacity:0;transition:opacity .3s var(--ease-out),transform .35s var(--ease-spring);pointer-events:none;z-index:200;max-width:85%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5);font-weight:500}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  #toast.ok{border-color:rgba(74,222,128,.3);color:var(--green)}
  #toast.err{border-color:rgba(248,113,113,.3);color:var(--red)}
  #toast.warn{border-color:rgba(251,191,36,.3);color:var(--yellow)}
  footer{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(15,17,21,.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:11px;color:var(--text-2);padding-bottom:calc(10px + env(safe-area-inset-bottom,0))}
  footer .spacer{flex:1}
  footer .clear-btn{padding:6px 10px;background:transparent;border:1px solid var(--border-2);border-radius:6px;color:var(--text-2);font-size:11px;cursor:pointer}
  @media (max-width:400px){.stats{grid-template-columns:repeat(2,1fr)}.header{padding:12px 14px}main{padding:12px}.tab{font-size:10px;padding:11px 12px}}
</style>
</head>
<body>

<header>
  <div class="logo">MT</div>
  <div class="title-block">
    <h1>MULTI TOOLS</h1>
    <div class="subtitle">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">ready</span>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="otp">OTP Spam</button>
  <button class="tab" data-tab="amsend">AM Send</button>
  <button class="tab" data-tab="amverify">AM Verify</button>
</div>

<main>

  <div class="panel active" id="panel-otp">
    <section>
      <h2>OTP Spam</h2>
      <label>Nomor target</label>
      <input id="otpPhone" placeholder="628123456789" inputmode="numeric">
      <div class="grid-2" style="margin-bottom:12px">
        <div><label>Rounds</label><input id="otpRounds" type="number" value="1" min="1" max="10"></div>
        <div><label>Workers</label><input id="otpWorkers" type="number" value="5" min="1" max="20"></div>
      </div>
      <button class="primary" id="otpBtn" onclick="runOtp()">Mulai Spam</button>
    </section>
    <section>
      <h2>Provider</h2>
      <div class="providers" id="otpProviders"></div>
      <h2 style="margin-top:16px">Statistik</h2>
      <div class="stats">
        <div class="stat tot"><span class="num" id="otpTotal">0</span><span class="label">Total</span></div>
        <div class="stat ok"><span class="num" id="otpOk">0</span><span class="label">OK</span></div>
        <div class="stat fl"><span class="num" id="otpFail">0</span><span class="label">Fail</span></div>
        <div class="stat dur"><span class="num" id="otpDur">0s</span><span class="label">Durasi</span></div>
      </div>
    </section>
    <section>
      <h2>Log</h2>
      <div id="log"></div>
    </section>
  </div>

  <div class="panel" id="panel-amsend">
    <section>
      <h2>AM Send</h2>
      <label>Email target</label>
      <input id="amSendEmail" type="email" placeholder="user@email.com" autocomplete="off" spellcheck="false">
      <button class="primary" id="amSendBtn" onclick="runAmSend()">Kirim</button>
    </section>
    <section>
      <h2>Hasil</h2>
      <div class="result-card" id="amSendResult"></div>
      <div id="logAm" style="display:none"></div>
    </section>
  </div>

  <div class="panel" id="panel-amverify">
    <section>
      <h2>AM Verify</h2>
      <label>Email target</label>
      <input id="amVerifyEmail" type="email" placeholder="user@email.com" autocomplete="off" spellcheck="false">
      <label>Link Firebase</label>
      <textarea id="amVerifyLink" placeholder="https://alight-creative.firebaseapp.com/__/auth/links?link=..." rows="4" spellcheck="false"></textarea>
      <button class="primary" id="amVerifyBtn" onclick="runAmVerify()">Kirim</button>
    </section>
    <section>
      <h2>Hasil</h2>
      <div class="result-card" id="amVerifyResult"></div>
    </section>
  </div>

</main>

<footer>
  <span id="footInfo">multi-tools</span>
  <span class="spacer"></span>
  <button class="clear-btn" onclick="clearLog()">Bersihkan</button>
</footer>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const logEl = $('#log');

function toast(msg, kind='') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2800);
}
function setStatus(text, cls='ready') {
  $('#statusText').textContent = text;
  const dot = $('#statusDot');
  dot.className = 'status-dot' + (cls === 'loading' ? ' loading' : cls === 'offline' ? ' offline' : '');
}
function log(msg, cls='info') {
  const d = document.createElement('div');
  d.className = 'log-entry ' + cls;
  const ts = new Date().toLocaleTimeString('id-ID', { hour12: false });
  d.innerHTML = `<span class="ts">${ts}</span><span class="body">${escapeHtml(msg)}</span>`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ''; toast('log dibersihkan'); }
function escapeHtml(s) { return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function normalizePhone(raw) {
  let d = String(raw).replace(/\D/g, '');
  if (d.startsWith('0')) d = '62' + d.slice(1);
  else if (d.startsWith('8')) d = '62' + d;
  else if (!d.startsWith('62')) d = '62' + d;
  return d;
}

// PROVIDERS
const PROVIDERS = {
  adiraku:{name:'Adiraku'},tokopedia:{name:'Tokopedia'},singa:{name:'Singa'},jogjakita:{name:'Jogjakita'},pinhome:{name:'Pinhome'},duniagames:{name:'Duniagames'},saturdays:{name:'Saturdays'},maulagi:{name:'Maulagi'},beautyhaul:{name:'Beautyhaul'}
};
(function renderProviders(){
  const el = $('#otpProviders');
  for (const [k, p] of Object.entries(PROVIDERS)) {
    const pill = document.createElement('div');
    pill.className = 'pill'; pill.dataset.key = k;
    pill.innerHTML = `<span class="dot"></span>${p.name}`;
    el.appendChild(pill);
  }
})();
function setPill(key, status) {
  const el = document.querySelector(`.pill[data-key="${key}"]`);
  if (!el) return;
  el.classList.remove('ok','fl','run');
  if (status) el.classList.add(status);
}

// OTP
async function runOtp() {
  const raw = $('#otpPhone').value.trim();
  if (!raw) return toast('nomor kosong', 'err');
  const phone = normalizePhone(raw);
  if (phone.length < 9) return toast('nomor terlalu pendek', 'err');
  const rounds = Math.max(1, Math.min(parseInt($('#otpRounds').value||'1'), 10));
  const workers = Math.max(1, Math.min(parseInt($('#otpWorkers').value||'5'), 20));

  const btn = $('#otpBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>running...';
  setStatus('running', 'loading');
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('ok','fl','run'));
  $('#otpTotal').textContent = 0;
  $('#otpOk').textContent = 0;
  $('#otpFail').textContent = 0;
  $('#otpDur').textContent = '0s';

  log(`target ${phone} | rounds=${rounds} workers=${workers}`, 'info');

  try {
    const t0 = performance.now();
    const res = await fetch('/api/otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, rounds, workers }),
    });
    const data = await res.json();
    const dur = ((performance.now() - t0) / 1000).toFixed(1);

    if (!data.ok) {
      log(`gagal: ${data.error || 'unknown'}`, 'err');
      toast('gagal', 'err');
      return;
    }

    $('#otpTotal').textContent = data.total;
    $('#otpOk').textContent = data.ok_count;
    $('#otpFail').textContent = data.fail_count;
    $('#otpDur').textContent = data.duration + 's';

    for (const r of data.results) {
      log(`${r.ok ? 'OK' : 'FL'} ${r.provider.padEnd(14)} ${r.detail}`, r.ok ? 'ok' : 'err');
      setPill(r.key, r.ok ? 'ok' : 'fl');
    }
    log(`selesai ${data.duration}s | total=${data.total} ok=${data.ok_count} fail=${data.fail_count}`, 'warn');
    toast(`ok ${data.ok_count}/${data.total} (${data.duration}s)`, data.ok_count > 0 ? 'ok' : 'err');
    setStatus('ready', 'ready');
  } catch (e) {
    log('error: ' + e.message, 'err');
    toast(e.message, 'err');
    setStatus('offline', 'offline');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Mulai Spam';
  }
}

// AM send
async function runAmSend() {
  const email = $('#amSendEmail').value.trim();
  if (!email) return toast('email kosong', 'err');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('format email salah', 'err');

  const btn = $('#amSendBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>loading...';
  setStatus('loading', 'loading');

  const card = $('#amSendResult');
  card.classList.remove('show','ok','err');

  try {
    const t0 = performance.now();
    const res = await fetch('/api/am/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    const dur = ((performance.now() - t0) / 1000).toFixed(1);
    const ok = res.ok && data.ok;

    card.classList.add('show', ok ? 'ok' : 'err');
    card.innerHTML = `
      <div class="row"><span class="k">Status</span><span class="v ${ok?'ok':'err'}">${ok?'✓ sukses':'✗ gagal'}</span></div>
      <div class="row"><span class="k">Email</span><span class="v">${escapeHtml(email)}</span></div>
      <div class="row"><span class="k">Durasi</span><span class="v">${dur}s</span></div>
      <pre style="margin-top:10px;background:#141821;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:10.5px;color:#a0aabc;overflow-x:auto;max-height:180px;white-space:pre-wrap;word-break:break-all">${escapeHtml(JSON.stringify(data, null, 2))}</pre>
    `;
    toast(ok ? 'AM Send sukses' : 'AM Send gagal', ok ? 'ok' : 'err');
    setStatus('ready', 'ready');
  } catch (e) {
    card.classList.add('show', 'err');
    card.innerHTML = `<div class="row"><span class="k">Error</span><span class="v err">${escapeHtml(e.message)}</span></div>`;
    toast(e.message, 'err');
    setStatus('offline', 'offline');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kirim';
  }
}

// AM verify
async function runAmVerify() {
  const email = $('#amVerifyEmail').value.trim();
  const link = $('#amVerifyLink').value.trim();
  if (!email) return toast('email kosong', 'err');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('format email salah', 'err');
  if (!link) return toast('link kosong', 'err');
  if (!link.startsWith('https://')) return toast('link harus https://', 'err');

  const btn = $('#amVerifyBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>loading...';
  setStatus('loading', 'loading');

  const card = $('#amVerifyResult');
  card.classList.remove('show','ok','err');

  try {
    const t0 = performance.now();
    const res = await fetch('/api/am/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, link }),
    });
    const data = await res.json();
    const dur = ((performance.now() - t0) / 1000).toFixed(1);
    const ok = res.ok && data.ok;

    card.classList.add('show', ok ? 'ok' : 'err');
    card.innerHTML = `
      <div class="row"><span class="k">Status</span><span class="v ${ok?'ok':'err'}">${ok?'✓ sukses':'✗ gagal'}</span></div>
      <div class="row"><span class="k">Email</span><span class="v">${escapeHtml(email)}</span></div>
      <div class="row"><span class="k">Durasi</span><span class="v">${dur}s</span></div>
      <pre style="margin-top:10px;background:#141821;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:10.5px;color:#a0aabc;overflow-x:auto;max-height:180px;white-space:pre-wrap;word-break:break-all">${escapeHtml(JSON.stringify(data, null, 2))}</pre>
    `;
    toast(ok ? 'AM Verify sukses' : 'AM Verify gagal', ok ? 'ok' : 'err');
    setStatus('ready', 'ready');
  } catch (e) {
    card.classList.add('show', 'err');
    card.innerHTML = `<div class="row"><span class="k">Error</span><span class="v err">${escapeHtml(e.message)}</span></div>`;
    toast(e.message, 'err');
    setStatus('offline', 'offline');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kirim';
  }
}

// TABS
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('#panel-' + t.dataset.tab).classList.add('active');
  });
});

// Enter submit
$('#otpPhone').addEventListener('keydown', e => { if (e.key === 'Enter') runOtp(); });
$('#amSendEmail').addEventListener('keydown', e => { if (e.key === 'Enter') runAmSend(); });
</script>
</body>
</html>
